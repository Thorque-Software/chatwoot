# Builds the Arroyo fork of Chatwoot and publishes it to GHCR.
# Runs on every push to arroyo/main.

name: Publish Arroyo Chatwoot image

on:
  push:
    branches:
      - arroyo/main
  workflow_dispatch:

env:
  IMAGE: ghcr.io/thorque-software/chatwoot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=chatwoot-arroyo
          cache-to: type=gha,mode=max,scope=chatwoot-arroyo
